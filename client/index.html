<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>EGO Client v1.0.0</title><link rel="stylesheet" href="css/base.css"><script src="js/core/i18n.js"></script><script src="js/look/look.js"></script><link rel="icon" type="image/svg+xml" href="assets/icons/orbit.svg" id="ego-favicon"></head><body>
<div class="ambient"></div><div class="app" id="app">
<nav class="rail" aria-label="Навигация"><div class="logo" title="EGO">e<span>.</span></div><div class="rail-group"><button class="rail-btn selected" data-page="chats" title="Диалоги" aria-label="Диалоги"><span data-icon="message"></span></button><button class="rail-btn" data-page="characters" title="Персонажи" aria-label="Персонажи"><span data-icon="users"></span></button><button class="rail-btn" data-page="worlds" title="Миры" aria-label="Миры"><span data-icon="globe"></span></button><button class="rail-btn" data-page="library" title="Библиотека" aria-label="Библиотека"><span data-icon="bookmark"></span></button></div><div class="rail-bottom"><button class="rail-btn" data-page="settings" title="Настройки" aria-label="Настройки"><span data-icon="settings"></span></button><div class="user-avatar" title="Локальный профиль">M</div></div></nav>
<aside class="sidebar" id="sidebar"><div class="side-top"><div class="overline">YOUR SPACE <span class="tiny-star">✳</span></div><div class="side-title"><h2 id="side-title">Диалоги</h2><button class="subtle-btn" id="collapse-side" title="Скрыть панель"><span data-icon="panel"></span></button></div><label class="search"><span data-icon="search"></span><input id="search" placeholder="Поиск..." autocomplete="off"><kbd>⌘ K</kbd></label><button class="new-chat" id="new-chat"><span data-icon="plus"></span> Новая история <span class="new-arrow">↗</span></button></div><div class="side-content" id="side-content"></div><div class="side-bottom"><span class="status-light"></span> EGO Visual Client <span class="side-version">v1.0.0</span></div></aside>
<main class="workspace"><header class="topbar"><div class="top-left"><button class="subtle-btn mobile-side" id="show-side" title="Панель"><span data-icon="panel"></span></button><div class="top-symbol" id="top-symbol">A</div><div><div class="top-name" id="top-name">Лира <span class="top-spark">✧</span></div><div class="top-subtitle" id="top-subtitle">Эфир · Тихая библиотека</div></div></div><div class="top-right"><span class="offline-label"><span class="mini-dot"></span> VISUAL PREVIEW</span><button class="subtle-btn" id="theme-shortcut" title="Сменить настроение"><span data-icon="moon"></span></button><button class="subtle-btn" id="toggle-inspector" title="Информация о сцене"><span data-icon="sliders"></span></button><button class="subtle-btn" id="chat-menu-button" title="Действия"><span data-icon="more"></span></button></div></header>
<div class="content" id="content"></div>
<div class="composer-wrap" id="composer-wrap"><div class="composer"><textarea id="message" rows="2" placeholder="Продолжить историю..." aria-label="Сообщение"></textarea><div class="composer-footer"><div class="composer-left"><button class="composer-tool" id="add-note" title="Вставить действие"><span data-icon="sparkles"></span></button><button class="composer-tool" id="add-dialogue" title="Вставить реплику"><span data-icon="quote"></span></button><span class="composer-divider"></span><span class="composer-mode">✦ RP · Сцена</span></div><div class="composer-right"><span class="counter" id="counter">0 / 4000</span><button class="send-btn" id="send" title="Отправить сообщение"><span data-icon="arrowup"></span></button></div></div></div><div class="composer-note">Локальный визуальный прототип · AI не подключён · Enter — отправить, Shift+Enter — новая строка</div></div>
</main>
<aside class="inspector" id="inspector"><div class="inspect-head"><div><div class="overline">CURRENT SESSION</div><h3>Пространство истории</h3></div><button class="subtle-btn" id="close-inspector" title="Закрыть"><span data-icon="x"></span></button></div><div class="inspect-scroll" id="inspect-content"></div></aside>
</div><div id="modal-root"></div><div id="toast-root" aria-live="polite"></div><script src="js/app/data-store.js"></script><script src="js/app/worlds.js"></script><script src="js/app/app.js"></script><script src="js/app/advanced-chat.js"></script><script src="js/app/chat-view.js"></script><script src="js/app/ux-foundation.js"></script><script src="js/app/quality-gate.js"></script><script src="js/core/account.js"></script><script src="js/core/device-lock.js"></script><script src="js/core/core-bridge.js"></script><script src="js/core/core-sync.js"></script><script src="js/core/chat-sync.js"></script><script src="js/core/profile.js"></script><script src="js/core/memory.js"></script><script src="js/core/enchant.js"></script><script src="js/app/templates.js"></script><script src="js/app/media-lab.js"></script><script src="js/app/tts.js"></script><script src="js/app/scroll-bottom.js"></script><script src="js/look/icons.js"></script><script src="js/look/planets.js"></script><script src="js/look/mobile.js"></script><link rel="stylesheet" href="css/features/core-bridge.css"><link rel="stylesheet" href="css/features/account.css"><link rel="stylesheet" href="css/features/memory.css"><link rel="stylesheet" href="css/features/world-editor.css"><link rel="stylesheet" href="css/features/profile.css"><link rel="stylesheet" href="css/features/enchant.css"><link rel="stylesheet" href="css/features/device-lock.css"><link rel="stylesheet" href="css/features/mobile.css"><link rel="stylesheet" href="css/features/tts.css"><link rel="stylesheet" href="css/looks/overhaul.css"></body></html>
